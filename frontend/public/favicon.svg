<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="packark">
  <title>packark</title>
  <!-- A crate: solid lid, notch, open body. The lid is filled rather than
       outlined because at 16px two thin parallel strokes merge into a smudge.
       Dark tile so the amber holds up against light and dark browser chrome. -->
  <rect width="64" height="64" rx="12" fill="#0d0f12"/>
  <path d="M11 19a5 5 0 0 1 5-5h32a5 5 0 0 1 5 5v9H11z" fill="#ffb454"/>
  <rect x="27.5" y="13" width="9" height="15" fill="#0d0f12"/>
  <path d="M11 28h42v17a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5z"
        fill="none" stroke="#ffb454" stroke-width="7" stroke-linejoin="round"/>
</svg>
